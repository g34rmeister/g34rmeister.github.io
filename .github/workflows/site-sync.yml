name: Site Sync Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lesson lists, navigation and sitemap match course-data.js
        run: python3 scripts/site_sync.py --check

      - name: Citations, anchors, assets and course data
        run: python3 scripts/check_site.py

      - name: Source registry covers every cited source
        run: python3 scripts/sources.py check

      - name: Lesson index is up to date
        run: python3 scripts/build_index.py --check
